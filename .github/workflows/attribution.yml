name: Attribution

# pull_request_target runs main's copy of this workflow and script against the
# PR's commits, read as git objects; a PR can't loosen the check.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attribution:
    name: Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits and description
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags origin "pull/$PR/head"
          bash scripts/check-attribution.sh "$BASE" "$HEAD_SHA"
