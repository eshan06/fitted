name: Attribution

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attribution:
    name: Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: bash scripts/check-attribution.test.sh
      - name: Check commits and description
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # Runs main's copy of the check, so a PR can't loosen it.
        run: |
          git show "$BASE:scripts/check-attribution.sh" > /tmp/check-attribution.sh 2>/dev/null || cp scripts/check-attribution.sh /tmp/check-attribution.sh
          bash /tmp/check-attribution.sh "$BASE"
