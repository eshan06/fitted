# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4e44e565f5c9bdb93c4b3b4727c14ee3"
application_url = "https://example.com"
embedded = true
name = "fitted"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_locales,write_app_proxy,write_files"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # The privacy webhooks every App Store app answers: ARCHITECTURE §16.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  # Keep each product on its chart: ARCHITECTURE §6, §16. updated_at keeps every
  # delivery distinct, so Shopify never debounces an edit away.
  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update" ]
  include_fields = [ "id", "updated_at" ]

  # The whole payload: a delete's holds no updated_at to include.
  [[webhooks.subscriptions]]
  uri = "/webhooks/collections"
  topics = [ "collections/update", "collections/delete" ]

# Size charts: ARCHITECTURE §5. Read and written only through app/models/chart.server.ts.
[metaobjects.app.chart]
name = "Size chart"
display_name_field = "name"
access.admin = "merchant_read"
access.storefront = "public_read"
capabilities.publishable = true
capabilities.translatable = true

[metaobjects.app.chart.fields.name]
name = "Name"
type = "single_line_text_field"
required = true
validations.max = 100

[metaobjects.app.chart.fields.template]
name = "Template"
type = "single_line_text_field"
required = true
validations.choices = [ "blank", "tops", "bottoms", "dresses", "bras_swimwear", "shoes", "kids", "headwear", "rings", "bracelets", "necklaces" ]

[metaobjects.app.chart.fields.content]
name = "Content"
type = "json"
required = true

[metaobjects.app.chart.fields.strings]
name = "Words"
type = "json"
required = true

[metaobjects.app.chart.fields.measure_image]
name = "How to measure image"
type = "file_reference"
validations.file_type_options = [ "Image" ]

[metaobjects.app.chart.fields.import_note]
name = "Import note"
type = "single_line_text_field"

# The plan for the storefront: ARCHITECTURE §7, §8. Written only by app/models/billing.server.ts.
[shop.metafields.app.plan]
name = "Fitted plan"
description = "Which Fitted plan the size guide follows. Fitted keeps it up to date."
type = "single_line_text_field"
validations.choices = [ "free", "standard", "pro" ]
access.admin = "merchant_read"

# Appearance, units, placement and fit finder settings: ARCHITECTURE §7. Written only by app/models/settings.server.ts.
[shop.metafields.app.settings]
name = "Fitted settings"
description = "How the size guide looks and where it shows. Change it in Fitted."
type = "json"
access.admin = "merchant_read"

# Display rules and the chart each product shows: ARCHITECTURE §6. Written only by app/models/rules.server.ts.
[shop.metafields.app.rules]
name = "Fitted display rules"
description = "Which products show which size chart. Change them in Fitted."
type = "json"
access.admin = "merchant_read"

[product.metafields.app.chart]
name = "Size chart"
description = "The size chart Fitted shows on this product. Change it with Fitted's display rules."
type = "metaobject_reference<$app:chart>"
access.admin = "merchant_read"
capabilities.admin_filterable = true

# The store's /apps/fitted/* reaches the app's /proxy/*, signed by Shopify:
# the size guide's events (ARCHITECTURE §12).
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "fitted"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
